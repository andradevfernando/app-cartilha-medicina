<body>
    <div id="app">
        <div style="min-height:100vh;display:grid;place-content:center;padding:2rem;background:#e8f5ed;color:#15346d;font-family:Inter,Arial,sans-serif;text-align:center">
            <strong style="font-size:1.25rem">Geo-Helmintíases</strong>
            <span style="margin-top:.55rem;color:#277743">Preparando o conteúdo...</span>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        window.addEventListener('scroll', () => {
            const button = document.getElementById('back-to-top-button');
            if (button) {
                button.classList.toggle('is-visible', window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 120);
            }
        }, { passive: true });
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
